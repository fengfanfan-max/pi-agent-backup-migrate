<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    width: 1280px; height: 800px;
    font-family: "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
    background: radial-gradient(1000px 500px at 85% -10%, #1e3a5f 0%, transparent 60%),
                radial-gradient(800px 450px at -10% 110%, #2d1b4e 0%, transparent 55%),
                linear-gradient(160deg, #0b1220 0%, #0e1526 55%, #101a30 100%);
    color: #e6edf7;
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    gap: 34px; text-align: center;
  }
  .logo {
    width: 110px; height: 110px; border-radius: 26px;
    background: linear-gradient(135deg, #4f8cff, #7b5cff);
    display: flex; align-items: center; justify-content: center;
    font-size: 56px; box-shadow: 0 12px 40px rgba(79,140,255,.4);
  }
  h1 { font-size: 52px; font-weight: 700; letter-spacing: .5px; }
  h1 span { color: #7fb0ff; }
  .tagline { font-size: 22px; color: #9fb3d1; }
  .chips { display: flex; gap: 14px; margin-top: 6px; }
  .chip {
    font-size: 17px; padding: 10px 22px; border-radius: 999px;
    background: rgba(255,255,255,.07); border: 1px solid rgba(255,255,255,.16);
    color: #cfe0f7;
  }
  .chip.green { border-color: rgba(80,220,150,.45); color: #7fe3b2; background: rgba(80,220,150,.08); }
  .install {
    margin-top: 8px; font-family: Consolas, "Courier New", monospace;
    font-size: 19px; color: #7fb0ff;
    background: rgba(0,0,0,.35); border: 1px solid rgba(255,255,255,.12);
    padding: 14px 28px; border-radius: 12px;
  }
</style>
</head>
<body>
  <div class="logo">💾</div>
  <div>
    <h1>pi-agent-<span>backup-migrate</span></h1>
    <div class="tagline">Your agent&rsquo;s save file — any machine, one command</div>
  </div>
  <div class="chips">
    <span class="chip">Windows</span>
    <span class="chip">macOS</span>
    <span class="chip">Linux</span>
    <span class="chip green">🔒 Secret-safe</span>
  </div>
  <div class="install">pi install npm:pi-agent-backup-migrate</div>
</body>
</html>
